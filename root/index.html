<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ely.by Documentation</title>
  <link rel="alternate" hreflang="ru" href="https://docs.ely.by/ru/">
  <link rel="alternate" hreflang="en" href="https://docs.ely.by/en/">
  <link rel="alternate" hreflang="x-default" href="https://docs.ely.by/ru/">
  <script>
    (function () {
      var ruLike = ['ru', 'be', 'uk', 'kk'];
      var languages = navigator.languages || [navigator.language || ''];
      var target = '/en/';
      for (var i = 0; i < languages.length; i++) {
        var lang = String(languages[i]).toLowerCase().split('-')[0];
        if (ruLike.indexOf(lang) !== -1) {
          target = '/ru/';
          break;
        }

        if (lang === 'en') {
          break;
        }
      }

      window.location.replace(target + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
  <ul>
    <li><a href="/ru/" hreflang="ru">Документация Ely.by на русском</a></li>
    <li><a href="/en/" hreflang="en">Ely.by documentation in English</a></li>
  </ul>
</body>
</html>
